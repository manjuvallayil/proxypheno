[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxypheno"
version = "0.1.0"
description = "ML proxy-phenotype engine for novel trait discovery in dairy cattle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=14.0",
  "lightgbm>=4.0",
  "matplotlib>=3.7",
  "streamlit>=1.30",
  "bed-reader>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxypheno"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
